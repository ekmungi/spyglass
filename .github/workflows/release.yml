# Builds the Obsidian plugin and publishes a GitHub release whose assets BRAT
# installs, then adds the Windows installer to it. Trigger: push a tag equal to the
# manifest version (e.g. 0.1.0).
#
# Test tags: a tag such as 0.41.0-test1 (the code's version plus -testN) runs the same build
# but publishes nothing. The installer is attached to the workflow run instead, downloadable
# from the run's page for a week, so the release path can be tried without a release that
# BRAT would install. Delete the test tag afterwards.
name: Release plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      # The code's version (the tag without any -testN), and whether this is a test tag.
      version: ${{ steps.tag.outputs.version }}
      test: ${{ steps.tag.outputs.test }}
    steps:
      - uses: actions/checkout@v4

      # First, before anything is published: the plugin files and the installer are named and
      # numbered after the tag, so a tag that differs from the code's version would ship a
      # Spyglass that reports another version. The installer job needs this job, so it stops too.
      - name: Check the tag matches the version in the code
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          tag = os.environ["TAG"].removeprefix("v")
          match = re.fullmatch(r"(\d+\.\d+\.\d+)(-test\d+)?", tag)
          if match is None:
              sys.exit(f"Tag '{tag}' is not a version such as 0.41.0 or a test tag such as 0.41.0-test1")
          version, test_build = match.group(1), match.group(2) is not None
          with open("manifest.json", encoding="utf-8") as handle:
              manifest = json.load(handle)["version"]
          with open("src/spyglass_service/__init__.py", encoding="utf-8") as handle:
              found = re.search(r'^__version__\s*=\s*"([^"]+)"', handle.read(), re.MULTILINE)
          if version != manifest:
              sys.exit(f"Tag '{tag}' differs from manifest.json's version '{manifest}'")
          if found is None:
              sys.exit("No __version__ found in src/spyglass_service/__init__.py")
          if version != found.group(1):
              sys.exit(f"Tag '{tag}' differs from __version__ '{found.group(1)}' in src/spyglass_service/__init__.py")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={version}\ntest={'true' if test_build else 'false'}\n")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Build plugin bundle
        working-directory: plugin
        run: |
          npm install
          npm run build

      - name: Publish release with plugin assets
        if: steps.tag.outputs.test != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # Idempotent: create the release if it does not exist, then (re)upload
          # the assets BRAT needs. --clobber lets a manual first release coexist.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --notes "Spyglass plugin $tag"
          fi
          gh release upload "$tag" manifest.json plugin/dist/main.js --clobber

  # Builds the one-file Windows installer (installer/spyglass.iss) and adds it to the same
  # release. Runs after `release`, which creates the release when it does not exist yet.
  installer:
    needs: release
    runs-on: windows-latest
    env:
      # uv is pinned and checked: the installer ships this exact uv.exe to every user.
      UV_VERSION: "0.10.9"
      UV_ZIP_SHA256: "f58dc40896000229db7c52b8bdd931394040ef2ad59abd1eda841f6d70b13d7a"
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.release.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Check the version is digits
        run: |
          # The version becomes the installer's version number, which Windows needs as digits.
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') { throw "Version '$env:VERSION' from tag '$env:TAG' is not a version such as 0.41.0" }

      - name: Build the interface
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Download the pinned uv and verify its checksum
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "uv.zip"
          $url = "https://github.com/astral-sh/uv/releases/download/$env:UV_VERSION/uv-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
          if ($actual -ne $env:UV_ZIP_SHA256) { throw "uv zip checksum $actual does not match the pinned $env:UV_ZIP_SHA256" }
          $unpacked = Join-Path $env:RUNNER_TEMP "uv"
          Expand-Archive -Path $zip -DestinationPath $unpacked
          $uv = Get-ChildItem -Path $unpacked -Recurse -Filter uv.exe | Select-Object -First 1
          Copy-Item -Path $uv.FullName -Destination installer\uv.exe

      - name: Build Spyglass.exe
        run: |
          # The launcher every starter opens, compiled with the .NET Framework 4.x compiler that
          # Windows includes. The script stops with a message naming the compiler's path when the
          # compiler is missing, and spyglass.iss will not compile without the launcher.
          & installer\build_launcher.ps1 -Version $env:VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup when it is missing
        run: |
          $default = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path $default)) {
            choco install innosetup -y --no-progress
          }

      - name: Build the installer
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$env:VERSION" installer\spyglass.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload the installer to the release
        if: needs.release.outputs.test != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload $env:TAG "installer\Output\Spyglass-Setup-$env:VERSION.exe" --clobber

      # A test tag publishes nothing: the installer is attached to this workflow run instead.
      - name: Attach the installer to the workflow run (test tags)
        if: needs.release.outputs.test == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Spyglass-Setup-${{ needs.release.outputs.version }}-${{ github.ref_name }}
          path: installer/Output/Spyglass-Setup-${{ needs.release.outputs.version }}.exe
          if-no-files-found: error
          retention-days: 7
